esphome:
  name: mhi-redux-s3-rmt-csspinodma
  friendly_name: MHI Redux S3 RMT-CS SPI Non-DMA Compile Test

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../../components
    components: [MhiAcCtrl]

MhiAcCtrl:
  id: mhi_ac
  frame_size: 20
  sck_pin: 8
  mosi_pin: 38
  miso_pin: 39
  rx_driver: rmt_cs_spi_nodma
  rmt_spi_frame_gap_us: 1000
  command_worker: false

climate:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    name: MHI Climate
