substitutions:
  device_name: mhi-ac-rmt-cs-spi
  friendly_name: MHI Air Conditioner

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.3.0
  name_add_mac_suffix: false

esp32:
  board: esp32-s3-devkitc-1  # ESP32 and ESP32-S3 are supported; change for your board.
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/Astute4185/MHI-AC-Ctrl-ESPHome_ESP-IDF
      ref: master
    components: [MhiAcCtrl]

MhiAcCtrl:
  id: mhi_ac
  # Use 20 for older units. Use 33 for horizontal vanes and 3D Auto feedback.
  frame_size: 33
  # Example ESP32-S3 pins. Replace these with the mapping for your board.
  sck_pin: 8
  mosi_pin: 38
  miso_pin: 39
  # FIFO-backed integrated RX/TX. No physical CS pin or tx_driver is used.
  rx_driver: rmt_cs_spi
  command_worker: true

climate:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    name: "${friendly_name}"

select:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    vertical_vanes:
      name: "Vanes Up-Down"
    horizontal_vanes:
      name: "Vanes Left-Right"

switch:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    vanes_3d_auto:
      name: "3D Auto"

sensor:
  - platform: MhiAcCtrl
    mhi_ac_ctrl_id: mhi_ac
    outdoor_temperature:
      name: "Outdoor Temperature"
